# Installation : cd scanner && uv run pre-commit install --config ../.pre-commit-config.yaml
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: bash -c 'cd scanner && uv run ruff check --fix .'
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff (format)
        entry: bash -c 'cd scanner && uv run ruff format .'
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: bash -c 'cd scanner && uv run mypy'
        language: system
        types: [python]
        pass_filenames: false
      - id: pas-de-env
        name: interdiction de committer .env
        entry: fichier .env interdit
        language: fail
        files: '(^|/)\.env$'
