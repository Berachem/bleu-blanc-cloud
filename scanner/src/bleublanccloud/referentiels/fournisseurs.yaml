# Référentiel des fournisseurs — Bleu Blanc Cloud
#
# Chaque fait (pays du siège, maison mère, exposition au Cloud Act, offre SecNumCloud, ASN)
# doit être justifié par au moins une URL source. Toutes les entrées démarrent en
# « a_verifier: true » : un fait n'est considéré comme vérifié qu'après relecture humaine.
#
# Champs :
#   motifs_domaines   suffixes de noms d'hôtes (ou « re:<regex> ») rattachés au fournisseur
#   motifs_cdn        motifs indiquant un rôle de CDN (hébergeur réel masqué → niveau C)
#   asn / asn_cdn     systèmes autonomes (hébergement / réseau de diffusion)
#   services_cdn      services des plages IP publiées qui sont un CDN (ex. CLOUDFRONT)
#   plages_cdn        toutes les plages IP publiées par ce fournisseur sont un CDN
#   en_tetes_origine  en-têtes HTTP révélant une origine hébergée chez ce fournisseur
#
# Niveau calculé (voir analyse/attribution.py) :
#   D si soumis_cloud_act ou autre_loi_extraterritoriale ;
#   A si siège ET maison mère dans l'UE ; B sinon.

# =========================================================================== #
# France et Union européenne
# =========================================================================== #

