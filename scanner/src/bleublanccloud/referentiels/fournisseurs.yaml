- id: auto-hebergement-public
  nom: Auto-hébergement public (collectivité ou groupement public)
  pays_siege: FR
  soumis_cloud_act: false
  # ASN confirmés d'organismes publics français
  asn:
    - 48799   # Ville et Eurométropole de Strasbourg
    - 49566   # Ville de Paris
    - 47608   # GIP Gigalis (Pays de la Loire)
  # Règle générique : nom d'AS d'un organisme public (texte comparé sans accents,
  # en minuscules) ; appliquée seulement si le pays connu de l'IP est la France.
  motifs_nom_as:
    - "\\b(ville|commune|mairie) (de |d'|du |des )"
    - "\\b(euro)?metropole\\b"
    - "\\bcommunaute (urbaine|d'agglomeration|de communes)\\b"
    - "\\bconseil (departemental|regional|general)\\b"
    - "\\b(departement|region) (de |d'|du |des )"
    - "\\bgroupement d'interet public\\b"
    - "^gip\\b"
    - "\\bsyndicat (mixte|intercommunal)\\b"
  # Formes juridiques de sociétés : écartées (ex. « Metropole Television SA »)
  exclusions_nom_as:
    - "\\b(sa|sas|sasu|sarl|eurl|sca|gmbh|ltd|llc|inc|bv|spa)\\b"
  pays_nom_as: [FR]
  categories: [hebergement, messagerie, dns]
  sources:
    - "https://bgpview.io/asn/48799"
    - "https://bgpview.io/asn/49566"
    - "https://bgp.tools/as/47608"
    - "https://gigalis.org/actualites/gigalis-devient-un-groupement-d-interet-public-gip-une-nouvelle-ere-pour-la-transformation-numerique-en-pays-de-la-loire/"
  remarque: "Infrastructure exploitée par l'organisme public lui-même (ou un groupement public) : niveau A. La règle générique sur le nom d'AS est une présomption signalée comme telle dans la preuve."
  a_verifier: true

