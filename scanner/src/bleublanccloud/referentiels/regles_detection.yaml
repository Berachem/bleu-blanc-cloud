# Règles de détection des services tiers — Bleu Blanc Cloud
#
# Chaque règle rattache des indices observables (scripts, ressources, cookies, en-têtes,
# enregistrements DNS, code HTML) à un service et à un fournisseur de fournisseurs.yaml.
#
#   categorie        catégorie notée : suites_saas, services_tiers, mesure_audience
#                    (ou « informatif » : affiché mais non noté)
#   type_service     sous-catégorie (sert aussi à proposer des alternatives)
#   niveau           niveau imposé quand il n'y a pas de fournisseur (solution auto-hébergée)
#   signal_positif   solution française, européenne ou auto-hébergée mise en avant
#   incompatible_avec  règles qui, si elles sont détectées, annulent celle-ci
#
# Motifs : les domaines sont comparés par suffixe ; chemins, cookies, en-têtes, txt, spf,
# mx, cname et html sont des expressions régulières (insensibles à la casse).
#
# Chaque règle possède au moins un exemple : il est rejoué automatiquement par les tests.

# =========================================================================== #
# Mesure d'audience, publicité, suivi
# =========================================================================== #

- id: google-analytics
  nom: Google Analytics
  categorie: mesure_audience
  type_service: analytique
  fournisseur_id: google
  motifs:
    domaines_scripts: ["google-analytics.com"]
    chemins: ["googletagmanager\\.com/gtag/js"]
    cookies: ["^_ga(_[A-Z0-9]+)?$", "^_gid$", "^_gat"]
    html: ["gtag\\(\\s*['\"]config['\"]\\s*,\\s*['\"](G|UA)-", "google-analytics\\.com/(analytics|ga)\\.js"]
  exemples:
    - {type: script, valeur: "https://www.googletagmanager.com/gtag/js?id=G-ABC123XYZ"}
    - {type: script, valeur: "https://www.google-analytics.com/analytics.js"}
    - {type: cookie, valeur: "_ga"}

