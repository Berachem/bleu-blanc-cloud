    html: ["\\bGTM-[A-Z0-9]{5,8}\\b"]
  exemples:
    - {type: script, valeur: "https://www.googletagmanager.com/gtm.js?id=GTM-ABCD123"}
    - {type: iframe, valeur: "https://www.googletagmanager.com/ns.html?id=GTM-ABCD123"}

