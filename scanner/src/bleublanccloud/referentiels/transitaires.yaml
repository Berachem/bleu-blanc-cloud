# Réseaux de transit — Bleu Blanc Cloud
#
# Un opérateur de transit (« transitaire ») achemine le trafic d'autres réseaux. Quand une
# adresse IP est annoncée par l'un de ces systèmes autonomes, c'est souvent qu'un client
# sans ASN propre (hébergeur régional, collectivité…) utilise des adresses fournies par son
# opérateur : l'hébergeur réel n'est pas connu.
#
# Règle (méthodologie, section 3) : un ASN de transit ne vaut JAMAIS attribution. Le constat
# reste « origine indéterminée » (niveau inconnu, exclu du calcul), sauf si le nom d'hôte
# (CNAME, MX, NS) ou une plage IP publiée désigne un fournisseur connu.
#
# Un ASN ne peut pas figurer à la fois ici et dans fournisseurs.yaml (vérifié au chargement).
# Comme pour les fournisseurs, chaque entrée a au moins une URL source et reste
# « a_verifier: true » tant qu'elle n'a pas été relue.

- id: cogent
  nom: Cogent Communications
  asn: [174]
  sources:
    - "https://bgp.tools/as/174"
    - "https://www.peeringdb.com/asn/174"
  a_verifier: true

