[project]
name = "bleublanccloud"
version = "0.1.0"
description = "Observatoire indépendant de la souveraineté numérique des organisations françaises — scanner passif."
readme = "README.md"
license = "EUPL-1.2"
authors = [{ name = "Berachem Markria" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.15",
    "rich>=13",
    "httpx[http2]>=0.28",
    "dnspython>=2.7",
    "selectolax>=0.3.27",
    "maxminddb>=2.6",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "PyYAML>=6.0",
    "tenacity>=9.0",
    "mistralai>=3.0,<4",
]

[project.scripts]
bbcloud = "bleublanccloud.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-PyYAML>=6.0",
    "pre-commit>=4.0",
    # Sous-ensemble de la police Luciole (script site/scripts/polices.py)
    "fonttools>=4.55",
    "brotli>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bleublanccloud"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PTH"]
ignore = [
    "RUF001", # caractères ambigus : le français utilise des apostrophes typographiques
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["bleublanccloud"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Typage strict exigé sur l'analyse et le score (CLAUDE.md, section 4)
module = ["bleublanccloud.analyse.*", "bleublanccloud.modeles"]
strict = true

[[tool.mypy.overrides]]
module = ["selectolax.*", "maxminddb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.coverage.run]
source = ["bleublanccloud"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
