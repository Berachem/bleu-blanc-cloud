[project]
name = "bleublanccloud-mcp"
version = "0.1.0"
description = "Serveur MCP (lecture seule) de l'observatoire Bleu Blanc Cloud : souveraineté numérique des collectivités françaises."
readme = "README.md"
license = "EUPL-1.2"
requires-python = ">=3.12"
authors = [{ name = "Berachem Markria" }]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.scripts]
bleublanccloud-mcp = "bleublanccloud_mcp.serveur:principal"
bleublanccloud-mcp-http = "bleublanccloud_mcp.en_ligne:principal"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bleublanccloud_mcp"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PTH"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["bleublanccloud_mcp"]
strict = true
